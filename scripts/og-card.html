<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card source</title>
<!--
  Artwork for assets/img/og-cover.png — screenshotted by scripts/make-og.sh.
  Reads ../content.js, so it follows the robot name, tagline and accent.
  Canvas is 1200x630, the Open Graph size.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,600;0,800;1,800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/css/binder.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    display: grid; grid-template-columns: 1.04fr 0.96fr; align-items: center;
    position: relative; background: var(--paper);
  }

  /* Faint engineering-paper grid, fading out under the text column. */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, var(--rule) 1px, transparent 1px),
      linear-gradient(to bottom, var(--rule) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: linear-gradient(105deg, transparent 22%, #000 78%);
  }
  /* Accent edge, same gesture as the nav's active indicator. */
  body::after {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 10px;
    background: var(--accent);
  }

  /* Normal flow, centred as a group, so longer text pushes instead of
     overlapping. */
  .card-text { position: relative; padding: 0 28px 0 76px; }

  .card-brand { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
  .card-brand img { width: 62px; height: 62px; }
  .card-brand b {
    font-family: var(--font-display);
    font-size: 30px; font-weight: 800; letter-spacing: -0.02em;
  }
  .card-brand b span { color: var(--accent); }

  .card-eyebrow {
    font-family: var(--font-mono);
    font-size: 15px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 12px;
  }
  .card-title {
    font-family: var(--font-display);
    font-size: 78px; font-weight: 800; font-style: italic;
    letter-spacing: -0.045em; word-spacing: 0.3em; line-height: 0.86;
    margin: 0; color: var(--ink);
  }
  .card-sub {
    margin: 26px 0 0; max-width: 24ch;
    color: var(--ink-2); font-size: 18px; line-height: 1.5;
  }
  .card-systems {
    margin: 32px 0 0;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .card-systems span {
    font-family: var(--font-mono);
    font-size: 13px; letter-spacing: 0.02em;
    padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--rule); background: var(--panel); color: var(--ink-3);
  }

  /* Bleeds off the right edge, so it reads as a crop not a thumbnail. */
  .card-figure { position: relative; height: 630px; }
  .card-figure img {
    position: absolute; top: 50%; left: -3%;
    width: 116%; transform: translateY(-50%);
  }

  .card-url {
    position: absolute; left: 76px; bottom: 40px;
    font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.04em;
    color: var(--ink-3);
  }
</style>
</head>
<body>
  <div class="card-text">
    <div class="card-brand">
      <img id="logo" src="" alt="">
      <b id="brand"></b>
    </div>
    <p class="card-eyebrow" id="eyebrow"></p>
    <h1 class="card-title" id="robot"></h1>
    <p class="card-sub" id="sub"></p>
    <div class="card-systems" id="systems"></div>
  </div>
  <div class="card-figure"><img id="hero" src="" alt=""></div>
  <div class="card-url" id="url"></div>

<script src="../content.js"></script>
<script>
(function () {
  var C = window.BINDER_CONTENT, t = C.team;
  document.documentElement.style.setProperty('--accent', t.accent);

  document.getElementById('logo').src = '../' + t.logo;
  document.getElementById('brand').innerHTML =
    'FRC <span>' + t.number + '</span> ' + t.name;
  document.getElementById('eyebrow').textContent =
    t.season + ' Technical Binder';
  // Same letter-for-picture swap the hero and the print cover do, so the
  // preview card shows the robot name the way the site does. Paths are
  // relative to scripts/, hence the '../'.
  var g = t.robotGlyph, name = String(t.robot || ''), i = -1;
  if (g && g.src && g.letter) {
    for (var n = 0; n < (g.at || 1); n++) {
      i = name.indexOf(g.letter, i + 1);
      if (i < 0) break;
    }
  }
  document.getElementById('robot').innerHTML = i < 0
    ? name
    : name.slice(0, i) +
      '<span class="robot-glyph"><img src="../' + g.src + '" alt=""></span>' +
      name.slice(i + g.letter.length);
  document.getElementById('hero').src = '../' + C.hero.image;

  // First sentence of the tagline only — the full one is too long at this size.
  document.getElementById('sub').textContent = t.tagline.split('. ')[0] + '.';

  // Reuse the hero callouts instead of keeping a second list.
  document.getElementById('systems').innerHTML = C.hero.callouts.map(function (c) {
    var s = C.sections.filter(function (x) { return x.id === c.id; })[0];
    return '<span>' + (s ? s.title : c.id) + '</span>';
  }).join('');

  // Matches CNAME — the only thing here not from content.js.
  document.getElementById('url').textContent = '2026.teamkoalafied.com';
}());
</script>
</body>
</html>
